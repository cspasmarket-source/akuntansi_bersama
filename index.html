.includes(k)?'type="number" min="0"':''} value="${h(x[k])}" placeholder="${k==='date'?formatDate(exp[i]?.date):k==='ref'?exp[i]?.ref:''}" onfocus="calcTarget=this" oninput="editLedger('${ledgerCode}',${i},'${k}',this.value)"></td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="scroll-tip">↔ ${state.lang==='id'?'Geser tabel ke samping pada HP.':'Swipe table sideways on mobile.'}</p><div class="row">${button('👁 '+t('preview'),'openPreview("ledger")')}${button('⊞ '+t('density'),'toggleDensity()')}</div><div class="bottom-nav"><button onclick="moveLedger(-1)" ${codes.indexOf(ledgerCode)===0?'disabled':''}>‹ ${t('previous')}</button><span class="pill">${codes.indexOf(ledgerCode)+1}/${codes.length}</span><button class="primary" onclick="moveLedger(1)">${codes.indexOf(ledgerCode)===codes.length-1?t('finish'):t('next')} ›</button></div></section>`}
function trialPage(){const s=state.session,codes=relevantCodes();return `<section class="card"><div class="row between"><h2>${t('trial')}</h2>${button('👁 '+t('ledger'),'openPreview("ledger")')}</div><div class="section-heading"><strong>${h(s.name)}</strong><strong>${t('trial')}</strong><span>${formatDate(s.settings.period)}</span></div><div class="table-wrap ${state.density}"><table class="tb-input-table"><thead><tr><th>No. Account</th><th>${t('account')}</th><th>${t('debit')}</th><th>${t('credit')}</th></tr></thead><tbody>${codes.map(code=>{const x=ensureTB(code);return `<tr><td>${code}</td><td>${h(acc(code))}</td><td><input type="number" min="0" value="${h(x.d)}" onfocus="calcTarget=this" oninput="editTB('${code}','d',this.value)"></td><td><input type="number" min="0" value="${h(x.c)}" onfocus="calcTarget=this" oninput="editTB('${code}','c',this.value)"></td></tr>`}).join('')}<tr><th colspan="2">${t('total')}</th><th class="num" id="tbDebit">${money(codes.reduce((n,c)=>n+val(s.tb[c]?.d),0))}</th><th class="num" id="tbCredit">${money(codes.reduce((n,c)=>n+val(s.tb[c]?.c),0))}</th></tr></tbody></table></div><p id="tbBalance" class="mini muted">${t('balanced')}</p><div class="row">${button('⌗ '+t('calculator'),'openCalculator()')}${button('✓ '+t('check'),'checkTrial()')}${button('💡 '+t('hint'),'requestHelp("hint")')}${button('📖 '+t('solution'),'requestHelp("solution")')}${button('👁 '+t('preview'),'openPreview("trial")')}</div><div class="bottom-nav"><button onclick="setStage(1)">‹ ${t('previous')}</button><button class="primary" onclick="reviewBeforeSubmit()">${t('review')} ›</button></div></section>`}
function results(){const s=state.session;if(!s||!s.submitted)return home();const g=grade();return `<div class="row between"><h1>${t('report')}</h1>${button('⌂ '+t('home'),'go("home")')}</div><section class="card" style="text-align:center"><div class="muted">${t('score')}</div><div class="score">${g.final}<small>/100</small></div><span class="pill">${h(s.name)} • ${h(s.seed)}</span><p class="muted">${h(s.settings.student)} • ${h(s.settings.npm)} • ${formatDate(s.settings.period)}</p></section><div class="grid3">${[t('journal'),t('ledger'),t('trial')].map((x,i)=>`<div class="card"><small>${x}</small><div class="kpi">${Math.round(g.part[i])}%</div><div class="progress"><div style="width:${g.part[i]}%"></div></div></div>`).join('')}</div><section class="card"><h3>${state.lang==='id'?'Rincian Penilaian':'Score Breakdown'}</h3><p>${state.lang==='id'?'Nilai berbobot':'Weighted score'}: ${g.weighted.toFixed(1)} / 100 (40% / 35% / 25%)</p><p>${state.lang==='id'?'Penalti bantuan':'Assistance penalties'}: −${g.penalty} ${s.settings.mode==='learn'?'(Learning Mode: free)':''}</p><p><strong>${t('score')}: ${g.final} / 100</strong></p><div class="row">${button('👁 '+t('all'),'openPreview("all")')}${button('⬇ '+t('pdfMine'),'printReport("mine")','primary')}${button('⬇ '+t('pdfKey'),'printReport("key")')}${button('⬇ '+t('pdfFull'),'printReport("full")')}</div></section><section class="card"><h3>${state.lang==='id'?'Analisis Kesalahan':'Error Analysis'} (${g.errors.length})</h3><p class="muted mini">${state.lang==='id'?'Penilaian parsial: akun, nominal, posting, saldo, dan neraca saldo.':'Partial credit for account choice, amounts, postings, balances and trial balance.'}</p>${g.errors.length?`<div style="max-height:330px;overflow:auto">${g.errors.slice(0,100).map(e=>`<p class="mini">• <strong>${h(e.stage)} ${h(e.ref)}</strong> — ${h(e.text)}</p>`).join('')}</div>`:`<p class="good">${state.lang==='id'?'Tidak ditemukan kesalahan.':'No mistakes found.'}</p>`}<div class="row">${button(t('retry'),'retryMistakes()')}${button(t('new'),'go("setup")')}</div></section>`}
function historyPage(){return `<div class="row between"><h1>${t('history')}</h1>${button('← '+t('home'),'go("home")')}</div><div class="card">${state.history.length?state.history.slice().reverse().map(x=>`<div class="row between" style="padding:12px 0;border-bottom:1px solid var(--border)"><div><strong>${h(x.company)}</strong><br><small>${h(x.date)} • ${h(x.seed)}</small></div><strong>${x.score}/100</strong></div>`).join(''):`<p class="muted">${state.lang==='id'?'Belum ada latihan yang selesai.':'No completed sessions yet.'}</p>`}</div><div class="row">${button(t('backup'),'exportProgress()')}${button(t('restore'),'document.getElementById("historyImport").click()')}<input class="hidden" type="file" id="historyImport" accept=".json,application/json" onchange="importProgress(this.files[0])"></div>`}
function go(v){state.view=v;if(v==='practice'&&state.session){currentTab=['journal','ledger','trial'][state.session.stage];if(!ledgerCode)ledgerCode=relevantCodes()[0]}save();render();window.scrollTo(0,0)}function setSetting(k,v){state.settings[k]=['count','timer'].includes(k)?Number(v):v;save()}function startFromForm(){const seed=document.getElementById('seed')?.value.trim();if(state.session&&!state.session.submitted&&!confirm(state.lang==='id'?'Latihan lama belum selesai. Ganti dengan sesi baru?':'Replace your unfinished session?'))return;createSession(seed)}function setStage(i){const s=state.session;if(i>s.stage)return;s.stage=i;currentTab=['journal','ledger','trial'][i];render();window.scrollTo(0,0)}function setField(path,v){snapshot();path(v);save()}function editJournal(i,k,v){const a=state.session.answers[currentIndex];if(!a.rows[i])return;setField(()=>{a.rows[i][k]=v;if(k==='d'&&val(v)>0)a.rows[i].c='';if(k==='c'&&val(v)>0)a.rows[i].d=''},v);updateJournalTotals()}function updateJournalTotals(){const a=state.session.answers[currentIndex],dr=a.rows.reduce((n,x)=>n+val(x.d),0),cr=a.rows.reduce((n,x)=>n+val(x.c),0);const el=document.querySelector('.journal-row')?.parentElement;/* rerender on blur to preserve focus */if(el){const labels=document.querySelectorAll('section.card .row.between strong');if(labels.length>=2){labels[labels.length-2].textContent=t('total')+' '+t('debit')+': '+money(dr);labels[labels.length-1].textContent=t('total')+' '+t('credit')+': '+money(cr)}}}function addJournalRow(){snapshot();state.session.answers[currentIndex].rows.push({code:'',d:'',c:''});render()}function removeJournalRow(i){const rows=state.session.answers[currentIndex].rows;if(rows.length<=1)return;snapshot();rows.splice(i===undefined?rows.length-1:i,1);render()}function flagQuestion(){const a=state.session.answers[currentIndex];a.flag=!a.flag;render()}function prevQuestion(){if(currentIndex>0){currentIndex--;render();window.scrollTo(0,0)}}function nextQuestion(){const s=state.session;if(currentIndex<s.tx.length-1){currentIndex++;render();window.scrollTo(0,0)}else confirmStage(1)}function resetQuestion(){if(!confirm(state.lang==='id'?'Hapus jawaban transaksi ini?':'Clear this transaction answer?'))return;snapshot();Object.assign(state.session.answers[currentIndex],{rows:[{code:'',d:'',c:''},{code:'',d:'',c:''}]});render()}function questionList(){const s=state.session;openModal(`<h2>${state.lang==='id'?'Daftar Transaksi':'Transaction List'}</h2><div class="grid">${s.tx.map((tx,i)=>`<button class="${i===currentIndex?'active':''}" onclick="currentIndex=${i};closeModal();render()">${i+1}. ${formatDate(tx.date)} ${s.answers[i].flag?'★':''} ${s.answers[i].rows.some(x=>x.code)?'✓':''}</button>`).join('')}</div>`)}
function confirmStage(next){const s=state.session;const counts=countCompleted();const unfinished=s.stage===0?s.tx.length-counts[0]:relevantCodes().length-counts[1];const flagged=s.answers.filter(x=>x.flag).length;openModal(`<h2>${state.lang==='id'?'Konfirmasi Pindah Tahap':'Confirm Stage Change'}</h2><p>${state.lang==='id'?'Tahap berikutnya akan dimulai. Jawaban sebelumnya tetap bisa dilihat dan diedit.':'You are about to enter the next stage. Previous answers remain available for review and editing.'}</p><p class="warn">${unfinished} ${state.lang==='id'?'belum diisi,':'unfinished,'} ${flagged} ${state.lang==='id'?'ditandai ragu-ragu.':'marked for review.'}</p><div class="row">${button(t('cancel'),'closeModal()')}${button(t('confirm'),`closeModal();state.session.stage=${next};currentTab='${['journal','ledger','trial'][next]}';render();window.scrollTo(0,0)`,'primary')}</div>`)}function chooseLedger(code){ledgerCode=code;render()}function filterLedgerAccounts(q){document.querySelectorAll('#ledgerAccountList button').forEach(b=>b.style.display=b.dataset.search.includes(q.toLowerCase())?'':'none')}function editLedger(code,i,k,v){setField(()=>{ensureLedger(code)[i][k]=v},v)}function moveLedger(dir){const codes=relevantCodes(),i=codes.indexOf(ledgerCode);if(i+dir>=0&&i+dir<codes.length){ledgerCode=codes[i+dir];render();window.scrollTo(0,0)}else if(dir>0)confirmStage(2)}function editTB(code,k,v){setField(()=>{ensureTB(code)[k]=v},v);const codes=relevantCodes(),d=codes.reduce((n,c)=>n+val(state.session.tb[c]?.d),0),cr=codes.reduce((n,c)=>n+val(state.session.tb[c]?.c),0);document.getElementById('tbDebit').textContent=money(d);document.getElementById('tbCredit').textContent=money(cr);document.getElementById('tbBalance').textContent=d===cr?t('balanced'):t('noBalance')}function toggleDensity(){state.density=state.density==='compact'?'comfortable':'compact';render()}
function hintContent(tx,level){const lines=tx.rows.map(x=>`${acc(x.code)} (${byCode[x.code]?.normal==='D'?'Debit-normal':'Credit-normal'})`);const l1=state.lang==='id'?'Identifikasi akun yang terpengaruh: ':'Identify the affected accounts: ';const l2=state.lang==='id'?'Tentukan akun yang bertambah/berkurang dan posisi debit atau kredit.':'Determine which accounts increase or decrease and their debit/credit sides.';const l3=state.lang==='id'?'Hitung persentase dengan mengalikan nilai total × persentase ÷ 100.':'For percentages, calculate total × percentage ÷ 100.';return `<strong>${t('hint')} ${level}/3</strong><p>${l1}${level>=1?lines.join(', '):''}</p>${level>=2?`<p>${l2} ${tx.rows.map(x=>`${acc(x.code)} → ${x.d?'Debit':'Credit'}`).join('; ')}</p>`:''}${level>=3?`<p>${l3} ${tx.rows.map(x=>`${acc(x.code)}: ${money(x.d||x.c)}`).join('; ')}</p>`:''}`}
function solutionContent(tx){return `<strong>${t('solution')}</strong><div class="table-wrap"><table><thead><tr><th>${t('account')}</th><th>${t('debit')}</th><th>${t('credit')}</th></tr></thead><tbody>${tx.rows.map(x=>`<tr><td class="${x.c?'indent':''}">${h(acc(x.code))}</td><td class="num">${x.d?money(x.d):''}</td><td class="num">${x.c?money(x.c):''}</td></tr>`).join('')}</tbody></table></div><p class="mini">${state.lang==='id'?'Debit = Kredit. Aset/beban bertambah di debit; kewajiban, modal, dan pendapatan bertambah di kredit.':'Debits equal credits. Assets and expenses increase on debit; liabilities, equity and revenue increase on credit.'}</p>`}
function requestHelp(kind){const s=state.session;if(s.stage!==0){const key=s.stage===1?'ledger-'+ledgerCode+'-'+kind:'trial-'+kind;const cost=s.settings.mode==='exam'&&!Object.prototype.hasOwnProperty.call(s.stageHelp||{},key)?10:0;if(cost){openModal(`<h2>⚠ ${state.lang==='id'?'Peringatan Penalti':'Penalty Warning'}</h2><p>${state.lang==='id'?'Membuka bantuan akan mengurangi 10 poin.':'Opening this assistance will deduct 10 points.'}</p><div class="row">${button(t('cancel'),'closeModal()')}${button(t('confirm'),'confirmStageHelp()','primary')}</div>`);window.confirmStageHelp=()=>{s.stageHelp[key]=10;closeModal();requestHelp(kind)};return}const info=s.stage===1?expectedLedger()[ledgerCode]:expectedTB();const content=s.stage===1?`<h3>${t(kind)}</h3><p>${state.lang==='id'?'Posting setiap baris berdasarkan Jurnal Umum, kemudian hitung saldo berjalan.':'Post each line from the journal and calculate running balances.'}</p>${kind==='solution'?ledgerHTML([ledgerCode],true):''}`:`<h3>${t(kind)}</h3><p>${state.lang==='id'?'Ambil saldo akhir tiap akun dari Buku Besar.':'Transfer each account closing balance from the ledger.'}</p>${kind==='solution'?trialHTML(true):''}`;openModal(content);return}const a=s.answers[currentIndex],already=kind==='hint'?a.hints>0:a.explained;const cost=s.settings.mode==='exam'&&!already?10:0;const act=()=>{if(kind==='hint')a.hints=Math.min(3,a.hints+1);else a.explained=true;if(cost){a.penalty+=cost;s.assistance.push({question:currentIndex+1,kind,cost})}closeModal();render()};if(cost){openModal(`<h2>⚠ ${state.lang==='id'?'Peringatan Penalti':'Penalty Warning'}</h2><p>${state.lang==='id'?`Membuka ${kind==='hint'?'Hint':'Pembahasan'} akan mengurangi 10 poin dari nilai akhir.`:`Opening ${kind==='hint'?'Hint':'Explanation'} deducts 10 points from your final score.`}</p><div class="row">${button(t('cancel'),'closeModal()')}${button(t('confirm'),'confirmHelp()','primary')}</div>`);window.confirmHelp=act}else act()}
function checkJournal(){const tx=state.session.tx[currentIndex],got=state.session.answers[currentIndex].rows;let correct=tx.rows.length===got.filter(x=>x.code||val(x.d)||val(x.c)).length;const used=new Set();for(const e of tx.rows){const i=got.findIndex((x,k)=>!used.has(k)&&x.code===e.code&&eq(x.d,e.d)&&eq(x.c,e.c));if(i<0)correct=false;else used.add(i)}toast(correct?(state.lang==='id'?'Jawaban benar!':'Correct answer!'):(state.lang==='id'?'Periksa akun, nominal, dan posisi debit/kredit.':'Review accounts, amounts, and debit/credit sides.'))}function checkLedger(){const expected=expectedLedger()[ledgerCode],got=ensureLedger(ledgerCode);const wrong=expected.filter((x,i)=>!eq(x.d,got[i].d)||!eq(x.c,got[i].c)||!eq(x.bd,got[i].bd)||!eq(x.bc,got[i].bc)).length;toast(wrong?`${wrong} ${state.lang==='id'?'baris perlu diperiksa.':'rows need review.'}`:(state.lang==='id'?'Nominal dan saldo sesuai.':'Amounts and balances match.'))}function checkTrial(){const exp=expectedTB(),wrong=relevantCodes().filter(c=>!eq(exp[c].d,state.session.tb[c]?.d)||!eq(exp[c].c,state.session.tb[c]?.c)).length;toast(wrong?`${wrong} ${state.lang==='id'?'akun perlu diperiksa.':'accounts need review.'}`:(state.lang==='id'?'Saldo akun sesuai.':'Account balances match.'))}
function reviewBeforeSubmit(){const s=state.session,counts=countCompleted(),unbalanced=s.answers.filter(a=>a.rows.reduce((n,x)=>n+val(x.d)-val(x.c),0)!==0).length,flags=s.answers.filter(a=>a.flag).length;openModal(`<h2>${t('review')}</h2><p>${state.lang==='id'?'Periksa pekerjaan sebelum dikumpulkan. Setelah dikumpulkan, nilai dan kunci jawaban tersedia.':'Review your work before final submission. Scores and answer keys are available afterward.'}</p><div class="grid">${[[t('journal'),`${counts[0]}/${s.tx.length}`],[t('ledger'),`${counts[1]}/${relevantCodes().length}`],[t('trial'),`${counts[2]}/${relevantCodes().length}`],['Unbalanced',unbalanced],['Flagged',flags],['Penalties',s.answers.reduce((n,a)=>n+a.penalty,0)]].map(([a,b])=>`<div class="tag"><small>${a}</small><br><strong>${b}</strong></div>`).join('')}</div><p class="warn">${state.lang==='id'?'Jawaban kosong akan mengurangi nilai.':'Incomplete answers will affect your score.'}</p><div class="row">${button(t('cancel'),'closeModal()')}${button(t('submit'),'submitFinal()','primary')}</div>`)}function submitFinal(){if(!confirm(state.lang==='id'?'Yakin ingin mengumpulkan seluruh jawaban?':'Submit all answers now?'))return;const s=state.session;s.submitted=true;s.completedAt=Date.now();const g=grade();state.history.push({company:s.name,seed:s.seed,date:new Date().toISOString().slice(0,10),score:g.final,types:g.errors.filter(x=>x.stage==='journal').map(x=>s.tx[x.ref-1]?.kind).filter(Boolean)});state.view='results';closeModal();render();window.scrollTo(0,0)}
function formatDate(d){if(!d)return'';if(d.endsWith('-00'))return state.lang==='id'?'Saldo Awal':'Opening';try{return new Date(d+'T12:00:00').toLocaleDateString(state.lang==='id'?'id-ID':'en-US',{day:'numeric',month:'short',year:'numeric'})}catch{return d}}
function journalHTML(correct=false){const s=state.session;let sumD=0,sumC=0;const body=s.tx.map((tx,i)=>{const rows=correct?tx.rows:s.answers[i].rows;return rows.filter(x=>x.code||val(x.d)||val(x.c)).map((x,k)=>{sumD+=val(x.d);sumC+=val(x.c);return `<tr><td>${k===0?formatDate(tx.date):''}</td><td class="${val(x.c)?'indent':''}">${h(acc(x.code))}</td><td>${h(x.code)}</td><td class="num">${val(x.d)?fmt(x.d):''}</td><td class="num">${val(x.c)?fmt(x.c):''}</td></tr>`}).join('')}).join('');return `<div class="section-heading"><strong>${h(s.name)}</strong><strong>${t('journal')}</strong><span>${formatDate(s.settings.period)}</span></div><div class="table-wrap"><table><thead><tr><th>${t('date')}</th><th>${t('account')}</th><th>${t('ref')}</th><th class="num">${t('debit')}</th><th class="num">${t('credit')}</th></tr></thead><tbody>${body}<tr><th colspan="3">${t('total')}</th><th class="num">${fmt(sumD)}</th><th class="num">${fmt(sumC)}</th></tr></tbody></table></div>`}
function ledgerHTML(codes=relevantCodes(),correct=false){const s=state.session,exp=expectedLedger();return `<div class="section-heading"><strong>${h(s.name)}</strong><strong>${t('ledger')}</strong><span>${formatDate(s.settings.period)}</span></div>${codes.map(code=>{const rows=correct?exp[code]:(s.ledger[code]||[]);return `<div class="print-ledger"><h3>${h(acc(code))} <small>(${code})</small></h3><div class="table-wrap"><table><thead><tr><th>${t('date')}</th><th>${t('account')}</th><th>${t('ref')}</th><th class="num">${t('debit')}</th><th class="num">${t('credit')}</th><th class="num">${t('balance')} ${t('debit')}</th><th class="num">${t('balance')} ${t('credit')}</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${h(x.date?.includes('-')?formatDate(x.date):x.date)}</td><td>${h(x.name||((x.ref==='OB')?(state.lang==='id'?'Saldo Awal':'Opening Balance'):''))}</td><td>${h(x.ref)}</td><td class="num">${val(x.d)?fmt(x.d):''}</td><td class="num">${val(x.c)?fmt(x.c):''}</td><td class="num">${val(x.bd)?fmt(x.bd):''}</td><td class="num">${val(x.bc)?fmt(x.bc):''}</td></tr>`).join('')}</tbody></table></div></div>`}).join('')}`}
function trialHTML(correct=false){const s=state.session,codes=relevantCodes(),expected=expectedTB();let dr=0,cr=0;return `<div class="section-heading"><strong>${h(s.name)}</strong><strong>${t('trial')}</strong><span>${formatDate(s.settings.period)}</span></div><div class="table-wrap"><table><thead><tr><th>No. Account</th><th>${t('account')}</th><th class="num">${t('debit')}</th><th class="num">${t('credit')}</th></tr></thead><tbody>${codes.map(code=>{const x=correct?expected[code]:s.tb[code]||{};dr+=val(x.d);cr+=val(x.c);return `<tr><td>${code}</td><td>${h(acc(code))}</td><td class="num">${val(x.d)?fmt(x.d):''}</td><td class="num">${val(x.c)?fmt(x.c):''}</td></tr>`}).join('')}<tr><th colspan="2">${t('total')}</th><th class="num">${fmt(dr)}</th><th class="num">${fmt(cr)}</th></tr></tbody></table></div>`}
function openingHTML(){const s=state.session;return `<h3>${t('opening')}</h3><div class="table-wrap"><table><thead><tr><th>${t('account')}</th><th>${t('debit')}</th><th>${t('credit')}</th></tr></thead><tbody>${s.opening.map(x=>`<tr><td>${h(acc(x.code))}</td><td class="num">${x.d?fmt(x.d):''}</td><td class="num">${x.c?fmt(x.c):''}</td></tr>`).join('')}</tbody></table></div>`}
function fullReport(kind){const s=state.session,g=grade(),correct=kind==='key';const intro=`<div class="section-heading"><h1>ACCOUNTING PRACTICE</h1><strong>${kind==='key'?t('pdfKey'):kind==='mine'?t('pdfMine'):t('pdfFull')}</strong><span>${h(s.settings.student)} • NPM: ${h(s.settings.npm)}</span><span>${h(s.name)} • ${formatDate(s.settings.period)} • ${h(s.seed)}</span></div>`;const score=kind!=='key'?`<div class="report-block"><h2>${t('score')}: ${g.final}/100</h2><p>${t('journal')}: ${Math.round(g.part[0])}% (40%) | ${t('ledger')}: ${Math.round(g.part[1])}% (35%) | ${t('trial')}: ${Math.round(g.part[2])}% (25%)</p><p>Weighted: ${g.weighted.toFixed(1)} • Assistance penalties: −${g.penalty}</p></div>`:'';const tables=(c)=>`${journalHTML(c)}<div class="print-page">${ledgerHTML(relevantCodes(),c)}</div><div class="print-page">${trialHTML(c)}</div>`;let output=intro+score+(s.existing?openingHTML():'')+tables(correct);if(kind==='full'){output+=`<div class="print-page"><h2>${state.lang==='id'?'Kunci Jawaban':'Correct Answer Key'}</h2>${tables(true)}</div><div class="print-page"><h2>${state.lang==='id'?'Analisis Kesalahan':'Error Analysis'}</h2>${g.errors.length?g.errors.map(e=>`<p>${h(e.stage)} ${h(e.ref)}: ${h(e.text)}</p>`).join(''):'No mistakes found.'}</div>`}return output}
function openPreview(kind){const s=state.session;if(!s)return;const html=kind==='journal'?journalHTML():kind==='ledger'?ledgerHTML():kind==='trial'?trialHTML():kind==='opening'?openingHTML():fullReport('mine');openModal(`<div class="row between"><h2>${t('preview')} — ${h(kind)}</h2>${button('⬇ '+t('download'),'printReport("'+(kind==='all'?'mine':kind)+'")','small')}</div>${html}`)}function printReport(kind){if(!state.session)return;closeModal();const k=['mine','key','full'].includes(kind)?kind:'mine';document.getElementById('printRoot').innerHTML=fullReport(k);document.title='Accounting_Practice_'+k+'_'+state.session.seed;setTimeout(()=>window.print(),180)}window.addEventListener('afterprint',()=>{document.title='Accounting Practice'});
function openModal(html){document.getElementById('modalRoot').innerHTML=`<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="row between" style="margin-bottom:10px"><span class="pill">Accounting Practice</span><button class="small" onclick="closeModal()">✕</button></div>${html}</div></div>`}function closeModal(){document.getElementById('modalRoot').innerHTML=''}function toast(msg){openModal(`<p>${h(msg)}</p>${button('OK','closeModal()','primary')}`)}function openTools(){openModal(`<h2>${state.lang==='id'?'Alat & Pengaturan':'Tools & Settings'}</h2><div class="row">${button(t('density'),'toggleDensity();closeModal()')}${button(t('focus'),'state.focus=!state.focus;closeModal();render()')}${button(t('backup'),'exportProgress()')}${button(t('all'),'openPreview("all")')}${button(t('home'),'closeModal();go("home")')}</div><p class="mini muted">Seed: ${h(state.session?.seed||'')}</p>`)}
function openCalculator(){calcVal='0';calcOp=null;calcFirst=null;calcFresh=false;renderCalculator()}function renderCalculator(){openModal(`<h2>${t('calculator')}</h2><div class="calc-display" id="calcDisplay">${h(calcVal)}</div><div class="calc-grid">${['AC','⌫','±','÷','7','8','9','×','4','5','6','−','1','2','3','+','%','0','.','='].map(x=>`<button class="${x==='='?'equal':''}" onclick="calcPress('${x}')">${x}</button>`).join('')}</div><div class="row" style="margin-top:12px">${button(state.lang==='id'?'Salin Hasil':'Copy Result','navigator.clipboard?.writeText(calcVal);closeModal()')}${button(state.lang==='id'?'Masukkan ke Kolom Aktif':'Insert into Active Field','insertCalc()','primary')}</div><p class="mini muted">${state.lang==='id'?'Ketuk kolom nominal sebelum membuka kalkulator.':'Tap an amount field before opening calculator.'}</p>`)}function calcPress(k){if(k==='AC'){calcVal='0';calcOp=null;calcFirst=null}else if(k==='⌫'){calcVal=calcVal.slice(0,-1)||'0'}else if(k==='±'){calcVal=String(-Number(calcVal))}else if(k==='%'){calcVal=String(Number(calcVal)/100)}else if('0123456789.'.includes(k)){if(calcFresh){calcVal='0';calcFresh=false}if(k==='.'&&calcVal.includes('.'))return;calcVal=calcVal==='0'&&k!=='.'?k:calcVal+k}else if(['+','−','×','÷'].includes(k)){calcFirst=Number(calcVal);calcOp=k;calcFresh=true}else if(k==='='&&calcOp){const b=Number(calcVal);const result=calcOp==='+'?calcFirst+b:calcOp==='−'?calcFirst-b:calcOp==='×'?calcFirst*b:b?calcFirst/b:0;calcVal=String(Math.round(result*100)/100);calcOp=null;calcFresh=true}const el=document.getElementById('calcDisplay');if(el)el.textContent=calcVal}function insertCalc(){if(calcTarget&&calcTarget.isConnected){calcTarget.value=calcVal;calcTarget.dispatchEvent(new Event('input',{bubbles:true}));closeModal()}else toast(state.lang==='id'?'Pilih kolom angka terlebih dahulu.':'Select an amount field first.')}
function exportProgress(){const blob=new Blob([JSON.stringify({version:3,exportedAt:new Date().toISOString(),state},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Accounting_Practice_Backup_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}async function importProgress(file){if(!file)return;try{const data=JSON.parse(await file.text());if(data.version!==3||!data.state?.settings||!Array.isArray(data.state.history))throw Error('Invalid backup format');if(!confirm(state.lang==='id'?'Timpa progres lokal dengan cadangan ini?':'Replace local progress with this backup?'))return;state=data.state;state.view='home';save();render()}catch(e){toast('Invalid backup: '+e.message)}}function retryMistakes(){const last=state.history.at(-1);if(!last){toast(state.lang==='id'?'Belum ada hasil latihan.':'No previous results yet.');return}state.settings.difficulty='medium';state.settings.count=20;state.settings.focusKinds=[...new Set(last.types||[])];state.view='setup';render();toast(state.lang==='id'?'Sesi baru akan lebih sering memunculkan jenis transaksi yang sebelumnya salah.':'The new session will prioritize transaction types you previously missed.');}
function toggleTheme(){state.dark=!state.dark;render()}document.getElementById('themeBtn').addEventListener('click',toggleTheme);document.getElementById('langBtn').addEventListener('click',()=>{state.lang=state.lang==='en'?'id':'en';render()});document.getElementById('focusBtn').addEventListener('click',()=>{state.focus=!state.focus;render()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&state.session){e.preventDefault();undoRedo(e.shiftKey?'redo':'undo')}});function tick(){const s=state.session;if(!s||s.submitted||state.view!=='practice')return;const el=document.getElementById('clock');if(!el||!s.settings.timer)return;const left=Math.max(0,s.settings.timer*60-Math.floor((Date.now()-s.started)/1000));el.textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;if(!left){if(s.settings.mode==='exam'){submitFinal()}else{el.textContent='00:00'}}}setInterval(tick,1000);render();
</script></body></html>
